[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # pin Node to a version compatible with Next 16
  NODE_VERSION = "20"

# Next's static export writes a /404.html — Netlify uses that automatically.
# We DON'T need a catch-all SPA rewrite here: each route (e.g. /checkout, /profile)
# is pre-rendered as its own /<route>/index.html, so direct hits and refreshes work.
